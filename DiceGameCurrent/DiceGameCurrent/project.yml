# The Xcode project, as a file rather than as a file nobody can read.
#
# WHY THIS EXISTS
#
# MAC_SETUP.txt has you create the project in Xcode and save it OUTSIDE the
# cloned repo, so the repo stays exactly as Swift Playgrounds expects. That
# is right for the Mac and impossible for CI: a cloud runner has no project
# to open, and the release build is the one thing the Monterey Mac cannot do
# (Xcode 14 is years below the SDK Apple requires for an upload).
#
# Committing a .pbxproj would solve it and cost more than it solves — it is
# a 2,000-line generated file that conflicts on every merge, and nothing in
# this repo can read it to check.
#
# So the project is DESCRIBED here and generated by XcodeGen, on the runner
# and on the Mac alike. Two things fall out of that, both of which have cost
# this project real build rounds:
#
#   * A new .swift file is in the build automatically. MAC_SETUP.txt's "IF
#     YOU EVER PULL A NEW VERSION" section exists because Xcode holds a
#     reference to every file individually, so a file that appears after a
#     git pull is on disk and not in the target — "cannot find X in scope",
#     on many lines, with no usable error. That has broken the build on both
#     machines simultaneously. A folder reference cannot do it.
#
#   * The Messages extension gets the same source and the same resources as
#     the app, stated once. `Bundle.main` inside an app extension is the
#     EXTENSION's bundle, so the 162 resources genuinely have to be in both
#     targets — eight call sites go through Bundle.main — and remembering
#     that by hand twice is how one of them ends up with 161.
#
# INSTALLING IT (once, on the Mac):     brew install xcodegen
# GENERATING THE PROJECT:               xcodegen generate
#
# This does not replace MAC_SETUP.txt steps 2-6. Either route works; this
# one is the one CI can take.

name: HotDice
options:
  bundleIdPrefix: com.example.hotdice
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Generated, so it is never in the repo to go stale.
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
    ENABLE_BITCODE: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:

  # ---------------------------------------------------------------- the app
  HotDice:
    type: application
    platform: iOS
    sources:
      # Folder references, not file lists. This is the whole point.
      - path: SwiftFiles
      - path: Resources
        # Resources are copied, not compiled — .obj and .ttf would
        # otherwise be handed to the Swift compiler.
        buildPhase: resources
      - path: LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hotdice
        # The INFOPLIST_KEY_* settings below only do anything when this is
        # on: they are inputs to a GENERATED Info.plist, not edits to a
        # file. Without it they are silently ignored — and the one that
        # matters most is the orientation pair, so the app would come up
        # rotating in every direction with nothing to point at.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: Hot Dice
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Portrait only, on both idioms. MAC_SETUP.txt explains why,
        # measured rather than assumed: ten of the eleven games build a
        # SQUARE playfield, so in landscape the height binds and the extra
        # width is thrown away while the button band is squeezed. Royal UR
        # is the one that gains, and can opt in on its own screen.
        #
        # Stated here because it is the one setting that does NOT travel in
        # the repo any other way — Swift Playgrounds keeps it in its own
        # project settings, and an Xcode target defaults to all four
        # orientations, so it is quietly re-enabled on every fresh project.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        # Slide Over and Split View stay allowed: a 320-point window is just
        # a narrow phone, and tools_bandlayout_verify.py checks that case.
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: HotDice.entitlements
    dependencies:
      - target: HotDiceMessages
        embed: true

  # ---------------------------------------------- the Messages extension
  HotDiceMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension
      # The SAME shared source, not a copy. The extension hosts the app's
      # own screens — DiceGameScreen is what a Rolls turn is played on in a
      # conversation — so it needs the suite, not a second one.
      - path: SwiftFiles
      - path: Resources
        buildPhase: resources
        # The eight music tracks are 13 MB of the 20 MB Resources folder,
        # and the extension has no business playing them: a Messages
        # extension that starts background music is fighting the host app
        # for the audio session, and it ships inside the app's own download
        # on top of the app's copy. Excluded, so the extension carries the
        # dice, the fonts, the artwork and the effects and nothing else.
        #
        # SoundEngine already copes: `url(forResource:)` returns nil for a
        # missing file and `BundleCheck` reports what is absent rather than
        # crashing, which is the behaviour the whole resource layer is
        # built on.
        excludes:
          - "*.m4a"
    settings:
      base:
        # The extension's id must be the app's with a suffix.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hotdice.messages
        INFOPLIST_KEY_CFBundleDisplayName: Hot Dice
        CODE_SIGN_ENTITLEMENTS: HotDiceMessages.entitlements
        # The iMessage app icon is a DIFFERENT asset type from the app's:
        # it is not square, it does not support Single Size, and the whole
        # ladder is required. tools_icon_export.py writes all 16 slots —
        # the 1024x768 App Store one is the one that fails validation late.
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
      # NSExtension's own keys. XcodeGen writes the rest of the plist; this
      # is the part that makes it a Messages extension rather than a
      # bundle Messages ignores.
    info:
      # Deliberately NOT inside MessagesExtension/, which is a `sources`
      # folder for this target: a generated plist sitting in a compiled
      # source directory is at best noise in the build and at worst copied
      # in as a resource. Kept beside project.yml, which is what generates
      # it.
      path: HotDiceMessages-Info.plist
      properties:
        CFBundleDisplayName: Hot Dice
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: MessagesViewController
