# The Xcode project, as a file rather than as a file nobody can read.
#
# THIS IS THE STANDALONE. Hot Dice as an app you open: eleven games,
# pass-and-play, the device going round the table. The Messages version is
# its own repository — see README.md — because the two ship on different
# schedules and the thing that differs between them is not a setting, it is
# how a turn travels.
#
# WHY THIS EXISTS
#
# MAC_SETUP.txt has you create the project in Xcode and save it OUTSIDE the
# cloned repo, so the repo stays exactly as Swift Playgrounds expects. That
# is right for the Mac and impossible for CI: a cloud runner has no project
# to open, and the release build is the one thing the Monterey Mac cannot do
# (Xcode 14 is years below the SDK Apple requires for an upload).
#
# Committing a .pbxproj would solve it and cost more than it solves — it is
# a 2,000-line generated file that conflicts on every merge, and nothing in
# this repo can read it to check.
#
# So the project is DESCRIBED here and generated by XcodeGen, on the runner
# and on the Mac alike. Two things fall out of that, both of which have cost
# this project real build rounds:
#
#   * A new .swift file is in the build automatically. MAC_SETUP.txt's "IF
#     YOU EVER PULL A NEW VERSION" section exists because Xcode holds a
#     reference to every file individually, so a file that appears after a
#     git pull is on disk and not in the target — "cannot find X in scope",
#     on many lines, with no usable error. That has broken the build on both
#     machines simultaneously. A folder reference cannot do it.
#
#   * The resources go in as ONE folder reference, so the count cannot
#     drift. There are 156 of them and eight call sites reach them through
#     `Bundle.main`; a file that is on disk and not in the target produces
#     no error at all, just a missing texture or a silent sound. (The
#     Messages repository states this folder twice, because `Bundle.main`
#     inside an app extension is the extension's own bundle. Here there is
#     one target and one statement.)
#
# INSTALLING IT (once, on the Mac):
#
#   NOT Homebrew, and not the current release. Homebrew dropped macOS 12
#   Monterey, and XcodeGen's current releases are swift-tools-version 5.9
#   where Xcode 14.2 ships Swift 5.7. 2.42.0 is the last release on 5.7
#   and targets macOS 10.13:
#
#     git clone https://github.com/yonaskolb/XcodeGen.git
#     cd XcodeGen && git checkout 2.42.0 && make install PREFIX=$HOME/.local
#
#   The CI runner is a supported macOS, so it just brews it — which means
#   the two machines run DIFFERENT XcodeGen versions, and that is exactly
#   why `projectFormat` is stated below rather than left to the default.
#   2.42.0 predates that option and ignores it, which is harmless: its own
#   default is the older format already.
#
# GENERATING THE PROJECT:               xcodegen generate
#
# This does not replace MAC_SETUP.txt steps 2-6. Either route works; this
# one is the one CI can take.

name: HotDice
# ----------------------------------------------------------------------
# THE BUNDLE IDENTIFIER — com.solid.hotdice
#
# Set, and stated TWICE on purpose: the prefix below and
# PRODUCT_BUNDLE_IDENTIFIER on the target. Which one Apple reads depends
# on the target, and a target whose identifier is not under the project's
# prefix is the shape that gets one of two bundle ids registered and not
# the other. `tools_release_verify.py` checks they agree.
#
# **Treat it as permanent.** Once a build exists under an identifier,
# changing it means a new app record and a fresh TestFlight history. The
# one moment it is still free to change is before the first upload: if
# Apple refuses the registration because somebody else holds
# `com.solid.*`, pick another now rather than working around it later.
#
# It also has to be registered, by hand, at developer.apple.com ->
# Identifiers, with this exact string. The gate cannot check that for
# you; the archive step is where a missing registration shows up.
# ----------------------------------------------------------------------

options:
  bundleIdPrefix: com.solid.hotdice
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Generated, so it is never in the repo to go stale.
  generateEmptyDirectories: false

  # THE PROJECT FILE FORMAT, STATED RATHER THAN INHERITED.
  #
  # XcodeGen defaults this to whatever Xcode was current when the version
  # you happen to have was released — today `xcode16_0`, which writes
  # object version 77. The first archive on CI died on it:
  #
  #     The project 'HotDice' cannot be opened because it is in a future
  #     Xcode project file format (77)
  #
  # The two machines that build this run DIFFERENT Xcodes — 14.2 on the
  # Monterey Mac, because that is the last one that runs there, and
  # whatever the runner image carries (15.4 at the time of writing). A
  # default that tracks the generator rather than the compiler is a
  # project the older of the two cannot open, and the Mac is the one that
  # cannot be upgraded.
  #
  # So it is pinned to the floor. A newer Xcode opens an older format
  # without complaint; the reverse is the error above. `xcodeVersion`
  # comes with it so LastUpgradeCheck does not claim a version neither
  # machine has.
  projectFormat: xcode14_0
  xcodeVersion: "14.2"

settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
    ENABLE_BITCODE: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

# ----------------------------------------------------------------------
# THE SCHEME — stated, because an archive that guesses signs wrong
# ----------------------------------------------------------------------
#
# With no scheme here, XcodeGen generated none and xcodebuild archived
# through one Xcode invented. That scheme archived a DEBUG configuration,
# and under automatic signing the configuration is what decides which
# identity Apple is asked for: Debug wants Apple Development, Release
# wants Apple Distribution. So the upload build asked App Store Connect
# for a development profile that cannot exist for a cloud runner, and
# said so twice:
#
#     Revoke certificate: Your account already has an Apple Development
#     signing certificate for this machine...
#     No profiles for 'com.solid.hotdice' were found: ... any iOS App
#     Development provisioning profiles
#
# Neither error mentions the configuration, which is what made it worth
# writing down. Archiving and profiling take Release; running, testing
# and analysing stay on Debug, where a developer wants them.
schemes:
  HotDice:
    build:
      targets:
        HotDice: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:

  # ---------------------------------------------------------------- the app
  HotDice:
    type: application
    platform: iOS
    sources:
      # Folder references, not file lists. This is the whole point.
      - path: SwiftFiles
      - path: Resources
        # Resources are copied, not compiled — .obj and .ttf would
        # otherwise be handed to the Swift compiler.
        buildPhase: resources
      # OUTSIDE the app folder on purpose. Swift Playgrounds refuses
      # Interface Builder documents outright — "not supported" — and
      # it syncs this folder, so a .storyboard sitting in it stops the
      # iPad building the app at all. Xcode needs one and Playgrounds
      # cannot have one, so it lives where only Xcode looks.
      - path: ../../XcodeOnly/LaunchScreen.storyboard
      # The app icon. In XcodeOnly for the same reason the storyboard is:
      # Swift Playgrounds syncs the app folder, and the storyboard sitting
      # in it stopped the iPad building at all. An asset catalog may well
      # be fine there — but "may well be" is exactly what cost that round,
      # so it goes where only Xcode looks.
      #
      # ASSETCATALOG_COMPILER_APPICON_NAME below was already set to
      # AppIcon and there was no catalog for it to name, which is not a
      # build error: it is a build that archives and then fails App Store
      # validation for having no icon. The PNG inside is generated by
      # tools_icon_export.py and git-ignored — see the note in the
      # .appiconset.
      - path: ../../XcodeOnly/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solid.hotdice
        # The INFOPLIST_KEY_* settings below only do anything when this is
        # on: they are inputs to a GENERATED Info.plist, not edits to a
        # file. Without it they are silently ignored — and the one that
        # matters most is the orientation pair, so the app would come up
        # rotating in every direction with nothing to point at.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: Hot Dice
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Portrait only, on both idioms. MAC_SETUP.txt explains why,
        # measured rather than assumed: ten of the eleven games build a
        # SQUARE playfield, so in landscape the height binds and the extra
        # width is thrown away while the button band is squeezed. Royal UR
        # is the one that gains, and can opt in on its own screen.
        #
        # Stated here because it is the one setting that does NOT travel in
        # the repo any other way — Swift Playgrounds keeps it in its own
        # project settings, and an Xcode target defaults to all four
        # orientations, so it is quietly re-enabled on every fresh project.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # THE iPAD TAKES ALL FOUR, AND IT IS NOT OPTIONAL.
        #
        # Apple's validator refuses the pair "portrait only" and
        # "multitasking allowed" together:
        #
        #     The "UIInterfaceOrientationPortrait" orientations were
        #     provided ... but you need to include all of the ...
        #     orientations to support iPad multitasking
        #
        # An iPad app that does not require full screen has its window
        # sized by the system, so Apple will not let it also claim one
        # orientation. The choice was which half to give up, and
        # multitasking won: Slide Over and Split View are supported
        # cases this suite is measured against, and the arena re-fits
        # itself to a window that changes shape rather than re-dealing.
        #
        # So an iPad can now be turned to landscape, where ten of the
        # eleven games show a square playfield with empty width either
        # side. That is the cost, and it is a worse-looking screen rather
        # than a broken one: the layout comes from the view's shape and
        # nothing in it assumes portrait.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Slide Over and Split View stay allowed: a 320-point window is just
        # a narrow phone, and tools_bandlayout_verify.py checks that case.
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Answers the export-compliance question in the build instead of
        # in a web form after every upload. True of this app and checked
        # rather than assumed: there is no networking in it at all, no
        # URLSession, no CryptoKit, and the only thing that leaves the
        # process is a Messages payload in the OTHER repository. `NO`
        # means "no non-exempt encryption", which is the answer Apple
        # wants for an app that does none.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        # NOTHING ABOUT SIGNING LIVES HERE.
        #
        # It was briefly `CODE_SIGN_IDENTITY: Apple Distribution`, on the
        # theory that the identity is what picks the profile. That is true
        # and it was still wrong: under AUTOMATIC signing Xcode signs an
        # archive with a DEVELOPMENT identity and applies the distribution
        # one later, at export. Naming a distribution identity reads to
        # Xcode as manual intent, and it says so:
        #
        #     HotDice is automatically signed for development, but a
        #     conflicting code signing identity Apple Distribution has
        #     been manually specified
        #
        # Which leaves automatic signing needing a DEVELOPMENT certificate
        # on whatever machine archives — something a throwaway cloud
        # runner cannot have, and cannot be given without revoking the
        # one this project's Mac uses.
        #
        # So CI signs MANUALLY, with the distribution certificate and an
        # App Store profile it is handed. Those settings are passed by the
        # workflow rather than written here, because the profile's name is
        # not known until the profile is installed. The Mac is untouched:
        # it archives through Xcode, which manages its own signing.
        Release: {}
